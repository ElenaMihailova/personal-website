<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Space+Grotesk:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Page not found — Elena Mikhailova</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        align-items: center;
        background-color: #f3f5fa;
        color: #18213f;
        display: flex;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 1.125rem;
        justify-content: center;
        line-height: 1.6;
        min-height: 100dvh;
        padding: 24px 16px;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 32rem;
      }

      .code {
        color: #56607f;
        font-size: 0.875rem;
      }

      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(2rem, 3vw + 1rem, 2.5rem);
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      p {
        color: #56607f;
      }

      a {
        align-items: center;
        background-color: #2a2ae6;
        color: #fff;
        display: inline-flex;
        font-size: 1rem;
        font-weight: 600;
        margin-top: 8px;
        min-height: 48px;
        padding: 12px 20px;
        text-decoration: none;
        transition: background-color 150ms ease;
        width: fit-content;
      }

      a:hover,
      a:active {
        background-color: #1f1fb3;
      }

      a:focus-visible {
        outline: 2px solid #2a2ae6;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be outdated or mistyped. Everything is on the homepage.</p>
      <a href="/">Go to the homepage</a>
    </main>
  </body>
</html>
